<!DOCTYPE html>
<html>
<head>
<title>Nesting selector</title>
<style>
.card { & > p { background-color: green } }
</style>
<script type="text/x-rustyprint-expect">
#yes { background-color: rgb(0, 128, 0) }
#no { background-color: rgba(0, 0, 0, 0) }
</script>
</head>
<body>
<div class=card><p id=yes></p></div><p id=no></p>
</body>
</html>
