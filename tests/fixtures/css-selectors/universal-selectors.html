<!DOCTYPE html>
<html>
<head>
<title>Universal selectors</title>
<style>
div > * { background-color: green }
</style>
<script type="text/x-rustyprint-expect">
#yes { background-color: rgb(0, 128, 0) }
#no { background-color: rgba(0, 0, 0, 0) }
</script>
</head>
<body>
<div><span id=yes></span></div><span id=no></span>
</body>
</html>
