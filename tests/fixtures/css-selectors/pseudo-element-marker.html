<!DOCTYPE html>
<html>
<head>
<title>::marker</title>
<style>
#t::marker { background-color: green }
#a::marker { content: "(" counter(list-item) ") " }
#b::marker { content: none }
#c::marker { color: red }
</style>
<script type="text/x-rustyprint-expect">
#t::marker { background-color: rgb(0, 128, 0) }
#t { background-color: rgba(0, 0, 0, 0) }
#a { layout-text: "(1) a" }
#b { layout-text: "b" }
#c::marker { color: rgb(255, 0, 0); white-space-collapse: preserve; text-transform: none }
#c { layout-text: "3. c" }
</script>
</head>
<body>
<p id=t>x</p>
<ol><li id=a>a</li><li id=b>b</li><li id=c>c</li></ol>
</body>
</html>
