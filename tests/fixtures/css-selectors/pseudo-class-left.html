<!DOCTYPE html>
<html>
<head>
<title>:left</title>
<style>
body { margin: 0 }
p { margin: 0; height: 20px }
.next { break-before: page }
@page :left { margin-left: 40px }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-page-x: 0 }
#b { layout-page-x: 40 }
</script>
</head>
<body>
<p id=a>a</p><p id=b class=next>b</p>
</body>
</html>
