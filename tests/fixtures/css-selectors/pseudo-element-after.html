<!DOCTYPE html>
<html>
<head>
<title>::after</title>
<style>
#t::after { background-color: green }
#u::after { content: "!" }
#v::before { content: "<" } #v::after { content: ">" }
</style>
<script type="text/x-rustyprint-expect">
#t::after { background-color: rgb(0, 128, 0) }
#t { background-color: rgba(0, 0, 0, 0); layout-text: "x" }
#u { layout-text: "u!" }
#v { layout-text: "<v>" }
</script>
</head>
<body>
<p id=t>x</p><p id=u>u</p><p id=v>v</p>
</body>
</html>
