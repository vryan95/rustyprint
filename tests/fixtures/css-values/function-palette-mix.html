<!DOCTYPE html>
<html>
<head>
<title>function-palette-mix</title>
<style>
@font-face { font-family: Simple; src: url(assets/simple.ttf) }
@font-face { font-family: Narrow; src: url(assets/narrow.ttf) }
@font-face { font-family: Var; src: url(assets/var.ttf) }
@font-face { font-family: Color; src: url(assets/color.ttf) }
@font-face { font-family: Feat; src: url(assets/features.ttf) }
.v { font-family: Var; font-optical-sizing: none }
p { font-family: Color }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { font-palette: palette-mix(in srgb, normal, light); layout-paint: "rect(#808000) pop clip-path rect(#808080)" }
#b { font-palette: palette-mix(in srgb, normal 100%, light 0%); layout-paint: "rect(#ff0000)" }
#c { font-palette: palette-mix(in oklch, light, --p 30%) }
#d { font-palette: normal }
warning: invalid value for `font-palette`
</script>
</head>
<body>
<p id=a style="font-palette: palette-mix(in srgb, normal, light)">A</p>
<p id=b style="font-palette: palette-mix(in srgb, normal 100%, light 0%)">A</p>
<p id=c style="font-palette: palette-mix(in oklch, light, 30% --p)">A</p>
<p id=d style="font-palette: palette-mix(normal, light)">A</p>
</body>
</html>
