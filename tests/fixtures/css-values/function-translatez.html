<!DOCTYPE html>
<html>
<head>
<title>function-translatez</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
#p > div { transform: translateZ(-100px) }
</style>
<script type="text/x-rustyprint-expect">
#a { transform: translateZ(-100px) }
#p { layout-paint: "transform(0.5,0,0,0.5,25,12.5)" }
#b { transform: translateZ(10px); layout-paint: "transform(1,0,0,1,0,0)" }
</script>
</head>
<body>
<div id=p style="perspective: 100px"><div id=a></div></div>
<div id=b style="transform: translateZ(10px)"></div>
</body>
</html>
