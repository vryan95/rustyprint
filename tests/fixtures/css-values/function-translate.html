<!DOCTYPE html>
<html>
<head>
<title>function-translate</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { transform: translate(10px); layout-paint: "transform(1,0,0,1,10,0)" }
#b { transform: translate(10px, 50%); layout-paint: "transform(1,0,0,1,10,25)" }
</script>
</head>
<body>
<div id=a style="transform: translate(10px)"></div>
<div id=b style="transform: translate(10px, 50%)"></div>
</body>
</html>
