<!DOCTYPE html>
<html>
<head>
<title>linear-gradient()</title>
<style>
body { margin: 0 }
div { width: 200px; height: 100px }
#a { background-image: linear-gradient(red, blue) }
#b { background-image: linear-gradient(90deg, red, blue) }
#c { background-image: linear-gradient(to top right, red 10%, blue) }
#d { background-image: linear-gradient(red) }
#e { background-image: linear-gradient(in oklab, red, blue) }
#f { color: lime; background-image: linear-gradient(currentcolor, 30%, red 2em) }
#g { background-image: linear-gradient(0.25turn, red, blue); background-size: 50px 50px }
</style>
<script type="text/x-rustyprint-expect">
#a { background-image: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255)); layout-gradient: "axial 100 -1 100 101" }
#b { background-image: linear-gradient(90deg, rgb(255, 0, 0), rgb(0, 0, 255)); layout-gradient: "axial -1 50 201 50" }
#c { background-image: linear-gradient(to top right, rgb(255, 0, 0) 10%, rgb(0, 0, 255)) }
#d { background-image: none; layout-gradient: none }
#e { background-image: linear-gradient(in oklab, rgb(255, 0, 0), rgb(0, 0, 255)) }
#f { background-image: linear-gradient(rgb(0, 255, 0), 30%, rgb(255, 0, 0) 32px) }
#g { background-image: linear-gradient(90deg, rgb(255, 0, 0), rgb(0, 0, 255)); layout-gradient: "axial -1 25 51 25"; paint-items: >8 }
warning: invalid value for `background-image`
</script>
</head>
<body>
<div id=a></div><div id=b></div><div id=c></div><div id=d></div><div id=e></div><div id=f></div>
<div id=g></div>
</body>
</html>
