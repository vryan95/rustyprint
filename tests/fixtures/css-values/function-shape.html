<!DOCTYPE html>
<html>
<head>
<title>shape()</title>
<style>
body { margin: 0; font-size: 16px; line-height: 20px }
p { margin: 0; width: 400px; clear: both }
.f { float: left; width: 100px; height: 100px }

</style>
<script type="text/x-rustyprint-expect">
#f { shape-outside: shape(from 0px 0px, hline to 50%, vline by 100%, hline to 0px, close) }
#a { layout-x: 50px }
</script>
</head>
<body>
<p><span class=f id=f style="shape-outside: shape(from 0 0, hline to 50%, vline by 100%, hline to 0, close)"></span><span id=a>First</span> line of text that wraps <span id=b>around</span> the float and then continues below it for a while longer than the float is tall.</p>
</body>
</html>
