<!DOCTYPE html>
<html>
<head>
<title>inset()</title>
<style>
body { margin: 0; font-size: 16px; line-height: 20px }
p { margin: 0; width: 400px; clear: both }
.f { float: left; width: 100px; height: 100px }

</style>
<script type="text/x-rustyprint-expect">
#f { shape-outside: inset(0px 50px 0px 0px round 0px 50px 0px 0px) }
#a { layout-x: >30px }
#a { layout-x: <45px }
</script>
</head>
<body>
<p><span class=f id=f style="shape-outside: inset(0 50px 0 0 round 0 50px 0 0)"></span><span id=a>First</span> line of text that wraps <span id=b>around</span> the float and then continues below it for a while longer than the float is tall.</p>
</body>
</html>
