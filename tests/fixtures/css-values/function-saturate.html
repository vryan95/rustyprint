<!DOCTYPE html>
<html>
<head>
<title>function-saturate</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { filter: saturate(0); layout-paint: "rect(#363636)" }
#b { filter: saturate(1); layout-paint: "rect(#ff0000)" }
</script>
</head>
<body>
<div id=a style="background: red; filter: saturate(0)"></div>
<div id=b style="background: red; filter: saturate(100%)"></div>
</body>
</html>
