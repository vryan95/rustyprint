<!DOCTYPE html>
<html>
<head>
<title>function-matrix</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { transform: matrix(1, 0, 0, 1, 10, 20); layout-paint: "transform(1,0,0,1,10,20)" }
#b { transform: matrix(2, 0, 0, 2, 0, 0); layout-paint: "transform(2,0,0,2,-50,-25)" }
</script>
</head>
<body>
<div id=a style="transform: matrix(1, 0, 0, 1, 10, 20)"></div>
<div id=b style="transform: matrix(2, 0, 0, 2, 0, 0)"></div>
</body>
</html>
