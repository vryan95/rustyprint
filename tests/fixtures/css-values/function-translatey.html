<!DOCTYPE html>
<html>
<head>
<title>function-translatey</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { transform: translateY(5px); layout-paint: "transform(1,0,0,1,0,5)" }
#b { transform: translateY(10%); layout-paint: "transform(1,0,0,1,0,5)" }
</script>
</head>
<body>
<div id=a style="transform: translateY(5px)"></div>
<div id=b style="transform: translateY(10%)"></div>
</body>
</html>
