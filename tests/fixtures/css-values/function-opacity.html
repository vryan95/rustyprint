<!DOCTYPE html>
<html>
<head>
<title>function-opacity</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { filter: opacity(0.5); layout-paint: "group(0.5) rect(#0000ff) /group" }
#b { filter: opacity(1); layout-paint: "!group rect(#0000ff)" }
</script>
</head>
<body>
<div id=a style="filter: opacity(0.5)"></div>
<div id=b style="filter: opacity(100%)"></div>
</body>
</html>
