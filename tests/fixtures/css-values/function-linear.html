<!DOCTYPE html>
<html>
<head>
<title>linear()</title>
<style>
@keyframes slide { from { margin-left: 100px } to { margin-left: 0px } }
div { animation: slide 4s -1s }
#a { animation-timing-function: linear(0, 0.25 75%, 1) }
#b { animation-timing-function: linear(0, 1 25% 75%, 0) }
#c { animation-timing-function: linear(0, 0.5, 0.5, 1) }
#bad { animation-timing-function: linear(0) }
</style>
<script type="text/x-rustyprint-expect">
#a { animation-timing-function: linear(0 0%, 0.25 75%, 1 100%); margin-left: 91.6667px }
#b { animation-timing-function: linear(0 0%, 1 25%, 1 75%, 0 100%); margin-left: 0px }
#c { animation-timing-function: linear(0 0%, 0.5 33.3333%, 0.5 66.6667%, 1 100%); margin-left: 62.5px }
warning: invalid value for `animation-timing-function`
</script>
</head>
<body>
<div id=a></div><div id=b></div><div id=c></div><div id=bad></div>
</body>
</html>
