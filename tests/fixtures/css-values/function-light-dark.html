<!DOCTYPE html>
<html>
<head>
<title>light-dark()</title>
<style>
#t { color: light-dark(green, red) }
#u { color-scheme: dark; color: light-dark(green, red); background-color: light-dark(white, black) }
#v { color-scheme: light dark; color: light-dark(green, red) }
#u span { border-top-color: light-dark(blue, yellow) }
</style>
<script type="text/x-rustyprint-expect">
#t { color: rgb(0, 128, 0) }
#u { color: rgb(255, 0, 0); background-color: rgb(0, 0, 0) }
#v { color: rgb(0, 128, 0) }
#u span { border-top-color: rgb(255, 255, 0) }
</script>
</head>
<body>
<div id=t></div><div id=u><span>x</span></div><div id=v></div>
</body>
</html>
