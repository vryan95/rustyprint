<!DOCTYPE html>
<html>
<head>
<title>function-hue-rotate</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { filter: hue-rotate(180deg); layout-paint: "rect(#006d6d)" }
#b { filter: hue-rotate(180deg); layout-paint: "rect(#006d6d)" }
#c { filter: hue-rotate(0deg); layout-paint: "rect(#ff0000)" }
</script>
</head>
<body>
<div id=a style="background: red; filter: hue-rotate(180deg)"></div>
<div id=b style="background: red; filter: hue-rotate(0.5turn)"></div>
<div id=c style="background: red; filter: hue-rotate()"></div>
</body>
</html>
