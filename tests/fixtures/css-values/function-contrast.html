<!DOCTYPE html>
<html>
<head>
<title>function-contrast</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { filter: contrast(0); layout-paint: "rect(#808080)" }
#b { filter: contrast(1.5); layout-paint: "rect(#0056ec)" }
</script>
</head>
<body>
<div id=a style="background: red; filter: contrast(0)"></div>
<div id=b style="background: rgb(20, 100, 200); filter: contrast(150%)"></div>
</body>
</html>
