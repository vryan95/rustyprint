<!DOCTYPE html>
<html>
<head>
<title>view()</title>
<style>
@keyframes slide { from { margin-left: 100px } to { margin-left: 0px } }
div { animation: slide 4s -1s }
#a { animation-timeline: view() }
#b { margin-left: 3px; animation-timeline: view(x 10px) }
#c { animation-timeline: view(auto 20%) }
#bad { animation-timeline: view(10px block 5px) }
</style>
<script type="text/x-rustyprint-expect">
#a { animation-timeline: view(); margin-left: 0px }
#b { animation-timeline: view(x 10px); margin-left: 3px }
#c { animation-timeline: view(auto 20%) }
warning: invalid value for `animation-timeline`
</script>
</head>
<body>
<div id=a></div><div id=b></div><div id=c></div><div id=bad></div>
</body>
</html>
