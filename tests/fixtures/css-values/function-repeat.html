<!DOCTYPE html>
<html>
<head>
<title>repeat()</title>
<style>
body { margin: 0 }
.g { display: grid; width: 300px; grid-auto-rows: 10px }
</style>
<script type="text/x-rustyprint-expect">
#a { grid-template-columns: repeat(3, 1fr) }
#a3 { layout-x: 200px; layout-width: 100px }
#b { grid-template-columns: repeat(auto-fill, 70px) }
#b5 { layout-x: 0px; layout-y: 20px }
#b4 { layout-x: 210px }
#c { grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)) }
#c2 { layout-x: 150px; layout-width: 150px }
#d { grid-template-columns: repeat(2, [x] 50px) [y] }
#d1 { layout-x: 50px }
#e { grid-template-columns: repeat(auto-fill, 100px) }
#e1 { layout-x: 100px }
</script>
</head>
<body>
<div class=g id=a style="grid-template-columns: repeat(3, 1fr)"><div></div><div></div><div id=a3></div></div>
<div class=g id=b style="grid-template-columns: repeat(auto-fill, 70px)"><div></div><div></div><div></div><div id=b4></div><div id=b5></div></div>
<div class=g id=c style="grid-template-columns: repeat(auto-fit, minmax(50px, 1fr))"><div></div><div id=c2></div></div>
<div class=g id=d style="grid-template-columns: repeat(2, [x] 50px) [y]"><div id=d1 style="grid-column: 2 x"></div></div>
<div class=g id=e style="grid-template-columns: repeat(auto-fill, 100px); width: auto; max-width: 250px; float: left"><div style="width: 180px"></div><div id=e1></div></div>
</body>
</html>
