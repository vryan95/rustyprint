<html>
<head>
<title>paint()</title>
<style>
body { margin: 0 }
div { width: 200px; height: 100px }
#a { background-image: paint(checkerboard, 2px, red) }
#b { background: paint(stripes) green }
#c { background-image: paint(1px) }
</style>
<script type="text/x-rustyprint-expect">

</head>

</body>
