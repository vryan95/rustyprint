<!DOCTYPE html>
<html>
<head>
<title>map</title>
<style>
body { margin: 0 }
img { display: block }
</style>
<script type="text/x-rustyprint-expect">
#m { display: inline }
html { layout-page-link-areas: "https://b.example/@100,50,100,50, https://a.example/@0,0,100,50" }
</script>
</head>
<body>
<img src="assets/photo.png" width=200 height=100 usemap="#shapes">
<img src="assets/photo.png" width=200 height=100 usemap="#missing">
<img src="assets/photo.png" width=200 height=100 usemap="shapes">
<map id=m name=shapes>
<area shape=rect coords="0,0,100,50" href="https://a.example/">
<area coords="200,100,100,50" href="https://b.example/">
</map>
</body>
</html>
