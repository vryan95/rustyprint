<!DOCTYPE html>
<html>
<head>
<title>mask-position</title>
<style>
body { margin: 0 }
div { width: 20px; height: 10px; background: blue; mask: url(assets/half.png) no-repeat }
</style>
<script type="text/x-rustyprint-expect">
#a { mask-position: 10px 0px; layout-mask: "2 5 0, 12 5 255, 17 5 0" }
#b { mask-position: 100% 0%; layout-mask: "12 5 255, 2 5 0" }
#c { mask-position: 0% 0% }
</script>
</head>
<body>
<div id=a style="mask-position: 10px 0"></div>
<div id=b style="mask-position: right top"></div>
<div id=c></div>
</body>
</html>
