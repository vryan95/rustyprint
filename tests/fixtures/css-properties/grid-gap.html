<!DOCTYPE html>
<html>
<head>
<title>grid-gap</title>
<style>
body { margin: 0 }
.g { display: grid; width: 300px; grid-template-columns: 1fr 1fr; grid-auto-rows: 10px }
</style>
<script type="text/x-rustyprint-expect">
#a { row-gap: 5px; column-gap: 10px; grid-row-gap: 5px; grid-column-gap: 10px }
#a2 { layout-x: 155px; layout-width: 145px }
#a3 { layout-y: 15px }
</script>
</head>
<body>
<div class=g id=a style="grid-gap: 5px 10px"><div></div><div id=a2></div><div id=a3></div></div>
</body>
</html>
