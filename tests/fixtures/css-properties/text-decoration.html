<!DOCTYPE html>
<html>
<head>
<title>text-decoration</title>
<style>
#t { text-decoration: underline dotted red 2px }
</style>
<script type="text/x-rustyprint-expect">
#t { text-decoration-line: underline; text-decoration-style: dotted; text-decoration-color: rgb(255, 0, 0); text-decoration-thickness: 2px; paint-items: >#r }
</script>
</head>
<body>
<div id=t>Text gjpq</div>
<div id=r>Text gjpq</div>
</body>
</html>
