<!DOCTYPE html>
<html>
<head>
<title>font-kerning</title>
<style>
#t { font-kerning: none }
</style>
<script type="text/x-rustyprint-expect">
#t { font-kerning: none; layout-width: >#r }
</script>
</head>
<body>
<div><span id=t>AVAVAVAV</span></div>
<div><span id=r>AVAVAVAV</span></div>
</body>
</html>
