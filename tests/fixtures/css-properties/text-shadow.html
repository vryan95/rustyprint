<!DOCTYPE html>
<html>
<head>
<title>text-shadow</title>
<style>
#t { text-shadow: red 1px 2px 3px }
</style>
<script type="text/x-rustyprint-expect">
#t { text-shadow: rgb(255, 0, 0) 1px 2px 3px; paint-items: >#r }
</script>
</head>
<body>
<div id=t>Text gjpq</div>
<div id=r>Text gjpq</div>
</body>
</html>
