<!DOCTYPE html>
<html>
<head>
<title>inset-inline-start</title>
<style>
body { margin: 0 }
.cb { position: relative; width: 200px; height: 100px; padding: 10px; border: 5px solid }
.cb > div { position: absolute; width: 20px; height: 20px }
</style>
<script type="text/x-rustyprint-expect">
#a { left: 10px; layout-x: 15px }
#b { right: 10px; left: auto; layout-x: 195px }
</script>
</head>
<body>
<div class=cb><div id=a style="inset-inline-start: 10px"></div>
<div id=b style="inset-inline-start: 10px; direction: rtl"></div></div>
</body>
</html>
