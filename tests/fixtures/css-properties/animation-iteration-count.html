<!DOCTYPE html>
<html>
<head>
<title>animation-iteration-count</title>
<style>
@keyframes slide { from { margin-left: 100px } to { margin-left: 0px } }
@keyframes grow { from, to { width: 5px } }
div { height: 1px; width: 10px }
#a { animation-iteration-count: infinite, 2.5 }
#b { animation: slide 4s linear -5s 2 }
#c { margin-left: 3px; animation: slide 4s linear -5s 0 }
#bad { animation-iteration-count: -1 }
</style>
<script type="text/x-rustyprint-expect">
#a { animation-iteration-count: infinite, 2.5 }
#b { margin-left: 75px }
#c { margin-left: 3px }
html { animation-iteration-count: 1 }
warning: invalid value for `animation-iteration-count`
</script>
</head>
<body>
<div id=a></div><div id=b></div><div id=c></div><div id=bad></div>
</body>
</html>
