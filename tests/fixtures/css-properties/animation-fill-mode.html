<!DOCTYPE html>
<html>
<head>
<title>animation-fill-mode</title>
<style>
@keyframes slide { from { margin-left: 100px } to { margin-left: 0px } }
@keyframes grow { from, to { width: 5px } }
div { height: 1px; width: 10px }
#a { animation-fill-mode: forwards, both }
#b { animation: slide 4s linear 1s; animation-fill-mode: backwards }
#c { animation: slide 4s linear -5s; animation-fill-mode: forwards }
#d { margin-left: 3px; animation: slide 4s linear -5s }
#bad { animation-fill-mode: auto }
</style>
<script type="text/x-rustyprint-expect">
#a { animation-fill-mode: forwards, both }
#b { margin-left: 100px }
#c { margin-left: 0px }
#d { margin-left: 3px }
html { animation-fill-mode: none }
warning: invalid value for `animation-fill-mode`
</script>
</head>
<body>
<div id=a></div><div id=b></div><div id=c></div><div id=d></div><div id=bad></div>
</body>
</html>
