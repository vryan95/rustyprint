<!DOCTYPE html>
<html>
<head>
<title>font-variant-alternates</title>
<style>
@font-face { font-family: Simple; src: url(assets/simple.ttf) }
@font-face { font-family: Narrow; src: url(assets/narrow.ttf) }
@font-face { font-family: Var; src: url(assets/var.ttf) }
@font-face { font-family: Color; src: url(assets/color.ttf) }
@font-face { font-family: Feat; src: url(assets/features.ttf) }
.v { font-family: Var; font-optical-sizing: none }
@font-feature-values Feat { @stylistic { s: 1; } @swash { w: 2; } @styleset { a: 1; } }
span { font-family: Feat }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { font-variant-alternates: stylistic(s); layout-width: 6px }
#b { font-variant-alternates: historical-forms styleset(a) swash(w); layout-width: 7px }
#c { font-variant-alternates: normal; layout-width: 5px }
#d { font-variant-alternates: styleset(a); font-variant-caps: small-caps }
warning: invalid value for `font-variant-alternates`
</script>
</head>
<body>
<p><span id=a style="font-variant-alternates: stylistic(s)">a</span></p>
<p><span id=b style="font-variant-alternates: swash(w) historical-forms styleset(a)">a</span></p>
<p><span id=c style="font-variant-alternates: stylistic(s, t)">a</span></p>
<p><span id=d style="font-variant: small-caps styleset(a)">a</span></p>
</body>
</html>
