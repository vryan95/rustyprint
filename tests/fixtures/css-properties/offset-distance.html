<!DOCTYPE html>
<html>
<head>
<title>offset-distance</title>
<style>
body { margin: 0 }
section { width: 200px; height: 100px }
div { width: 20px; height: 10px; background: blue }
div { offset-path: ray(90deg) }
</style>
<script type="text/x-rustyprint-expect">
#a { offset-distance: 20px }
#p { layout-paint: "transform(1,0,0,1,110,45)" }
#b { offset-distance: 0px }
</script>
</head>
<body>
<section id=p><div id=a style="offset-distance: 20px"></div></section>
<div id=b></div>
</body>
</html>
