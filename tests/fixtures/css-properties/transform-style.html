<!DOCTYPE html>
<html>
<head>
<title>transform-style</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
#p, #q { transform: rotateY(60deg) }
#p > div, #q > div { transform: rotateY(-60deg) }
</style>
<script type="text/x-rustyprint-expect">
#p { transform-style: preserve-3d; layout-paint: "transform(0.5,0,0,1,25,0) transform(2,0,0,1,-50,0)" }
#q { transform-style: flat; layout-paint: "transform(0.5,0,0,1,25,0) transform(0.5,0,0,1,25,0)" }
</script>
</head>
<body>
<div id=p style="transform-style: preserve-3d"><div></div></div>
<div id=q><div></div></div>
</body>
</html>
