<!DOCTYPE html>
<html>
<head>
<title>perspective</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
#p > div, #q > div { transform: translateZ(-100px) }
</style>
<script type="text/x-rustyprint-expect">
#p { perspective: 100px; layout-paint: "transform(0.5,0,0,0.5,25,12.5)" }
#q { perspective: none; layout-paint: "transform(1,0,0,1,0,0)" }
</script>
</head>
<body>
<div id=p style="perspective: 100px"><div></div></div>
<div id=q><div></div></div>
</body>
</html>
