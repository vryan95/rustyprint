<!DOCTYPE html>
<html>
<head>
<title>corner-inline-start-shape</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
div { border-radius: 10px }
</style>
<script type="text/x-rustyprint-expect">
#a { corner-top-left-shape: notch; corner-bottom-left-shape: squircle }
#b { corner-top-left-shape: bevel; corner-bottom-left-shape: bevel }
</script>
</head>
<body>
<div id=a style="corner-inline-start-shape: notch squircle"></div>
<div id=b style="corner-inline-start-shape: bevel"></div>
</body>
</html>
