<!DOCTYPE html>
<html>
<head>
<title>mask-composite</title>
<style>
body { margin: 0 }
div { width: 20px; height: 20px; background: blue }
div { mask-image: linear-gradient(black, black), url(assets/half.png); mask-repeat: no-repeat; mask-size: 100% 100% }
</style>
<script type="text/x-rustyprint-expect">
#a { mask-composite: subtract; layout-mask: "2 10 0, 18 10 255" }
#b { mask-composite: intersect; layout-mask: "2 10 255, 18 10 0" }
#c { mask-composite: exclude; layout-mask: "2 10 0, 18 10 255" }
#d { mask-composite: add; layout-mask: "2 10 255, 18 10 255" }
</script>
</head>
<body>
<div id=a style="mask-composite: subtract"></div>
<div id=b style="mask-composite: intersect"></div>
<div id=c style="mask-composite: exclude"></div>
<div id=d></div>
</body>
</html>
