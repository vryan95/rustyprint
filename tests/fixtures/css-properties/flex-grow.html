<!DOCTYPE html>
<html>
<head>
<title>flex-grow</title>
<style>
body { margin: 0 }
.c { display: flex; width: 300px; height: 10px }
.c > div { flex-basis: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { flex-grow: 1; layout-width: 100px; layout-x: 0px }
#b { flex-grow: 2; layout-width: 200px; layout-x: 100px }
#n { flex-grow: 0; layout-width: 0px }
#q { flex-grow: 0.25; layout-width: 75px }
#r { layout-width: 75px; layout-x: 75px }
#m { layout-width: 120px }
#o { layout-width: 180px }
#d { flex-grow: 0 }
</script>
</head>
<body>
<div class=c><div id=a style="flex-grow: 1"></div><div id=b style="flex-grow: 2"></div><div id=n></div></div>
<div class=c><div id=q style="flex-grow: 0.25"></div><div id=r style="flex-grow: 0.25"></div></div>
<div class=c><div id=m style="flex-grow: 1; max-width: 120px"></div><div id=o style="flex-grow: 1"></div></div>
<div id=d style="flex-grow: 0"></div>
</body>
</html>
