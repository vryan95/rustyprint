<!DOCTYPE html>
<html>
<head>
<title>object-position</title>
<style>
img { width: 100px; height: 100px; object-fit: none }
#b { object-position: left top }
#c { object-position: right 10px bottom 0 }
#d { object-position: 25% 75% }
</style>
<script type="text/x-rustyprint-expect">
#a { object-position: 50% 50%; layout-image: "30 40 40 20" }
#b { object-position: 0% 0%; layout-image: "0 0 40 20" }
#c { object-position: right 10px bottom 0px; layout-image: "50 80 40 20" }
#d { layout-image: "15 60 40 20" }
</script>
</head>
<body>
<p><img id=a src="assets/photo.png"><img id=b src="assets/photo.png"><img id=c src="assets/photo.png">
<img id=d src="assets/photo.png"></p>
</body>
</html>
