<!DOCTYPE html>
<html>
<head>
<title>offset-position</title>
<style>
body { margin: 0 }
section { width: 200px; height: 100px }
div { width: 20px; height: 10px; background: blue }
div { offset-path: ray(180deg); offset-distance: 10px }
</style>
<script type="text/x-rustyprint-expect">
#a { offset-position: 0px 0px }
#p { layout-paint: "transform(0,1,-1,0,5,0)" }
#b { offset-position: auto }
#c { offset-position: normal }
</script>
</head>
<body>
<section id=p><div id=a style="offset-position: 0 0"></div></section>
<div id=b style="offset-position: auto"></div>
<div id=c></div>
</body>
</html>
