<!DOCTYPE html>
<html>
<head>
<title>clip</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
#a { position: absolute; top: 100px; width: 50px }
</style>
<script type="text/x-rustyprint-expect">
#a { clip: rect(0px, 40px, 30px, auto); layout-paint: "clip rect(#0000ff) pop" }
#b { clip: rect(1px, 2px, 3px, 4px); layout-paint: "!clip" }
#c { clip: auto }
</script>
</head>
<body>
<div id=a style="clip: rect(0, 40px, 30px, auto)"></div>
<div id=b style="clip: rect(1px 2px 3px 4px)"></div>
<div id=c></div>
</body>
</html>
