<!DOCTYPE html>
<html>
<head>
<title>clear</title>
<style>
body { margin: 0; font-size: 16px; line-height: 20px }
p { margin: 0 }
.box { display: flow-root; width: 300px; height: 100px }
#a { clear: left }
#b { clear: right }
#c, #f { clear: both }
#e { clear: inline-start }
.l { float: left; width: 50px }
.r { float: right; width: 50px }
.t { display: table; clear: both }
</style>
<script type="text/x-rustyprint-expect">
#a { clear: left; layout-y: 50px }
#b { clear: right; layout-y: 150px }
#c { clear: both; layout-y: 280px }
#d { clear: none; layout-y: 350px }
#e { clear: inline-start; layout-y: 450px }
#f { clear: both; layout-y: 540px }
#g { clear: top; layout-y: 600px }
#h, #i { layout-y: 766px }
#j, #k { layout-y: 867px }
#l { layout-y: 967px }
#m { layout-y: 969px }
#n { layout-y: 1067px }
#o { layout-y: 1092px }
#q { layout-y: 1167px }
#r { layout-y: 1302px }
</script>
</head>
<body>
<div class=box><div class=l style="height: 50px"></div><div id=a>a</div></div>
<div class=box><div class=r style="height: 50px"></div><div id=b>b</div></div>
<div class=box><div class=l style="height: 50px"></div><div class=r style="height: 80px"></div><div id=c>c</div></div>
<div class=box><div class=l style="height: 50px"></div><div id=d style="width: 100px; margin-top: 50px">d</div></div>
<div class=box dir=rtl><div class=r style="height: 50px"></div><div class=l style="height: 80px"></div><div id=e>e</div></div>
<div class=box><div class=l style="height: 40px"></div><div class=l id=f style="height: 10px">f</div></div>
<div class=box><div class=l style="height: 10px"></div><p id=g style="clear: top">g</p></div>
<!-- A margin that collapses through the cleared box's ancestors moves them, and the floats
     are where they were: the box goes to the floats' bottom, not that margin lower. -->
<div class=box style="padding-top: 1px"><div class=r style="height: 65px"></div><div><div style="margin-top: 8px">h<div id=h class=t></div></div></div><p id=i>i</p></div>
<div class=box style="padding-top: 1px"><div class=r style="height: 65px"></div><div><div></div><div style="margin-top: 8px">j<div id=j class=t></div></div></div><p id=k>k</p></div>
<!-- An empty box with clearance sits at the floats' bottom, and its margins collapse with
     what follows from its top margin edge. -->
<div class=box><div class=l style="height: 65px"></div><div id=l style="clear: both; margin: 5px 0 7px"></div><p id=m>m</p></div>
<div class=box><div class=l style="height: 65px"></div><div id=n style="clear: both; margin: 5px 0 30px"></div><p id=o style="margin-top: 12px">o</p></div>
<div class=box><div class=l style="height: 65px"></div><div><div style="margin-top: 8px">p<div style="clear: both"></div></div></div><p id=q>q</p></div>
<div class=box><div class=l style="height: 65px"></div><div style="clear: both; margin: 100px 0 7px"></div><p id=r>r</p></div>
</body>
</html>
