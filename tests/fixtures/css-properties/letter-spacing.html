<!DOCTYPE html>
<html>
<head>
<title>letter-spacing</title>
<style>
#t { letter-spacing: 2px }
</style>
<script type="text/x-rustyprint-expect">
#t { letter-spacing: 2px; layout-width: >#r }
</script>
</head>
<body>
<div><span id=t>Text</span></div>
<div><span id=r>Text</span></div>
</body>
</html>
