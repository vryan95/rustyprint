<!DOCTYPE html>
<html>
<head>
<title>width</title>
<style>
#t { width: calc(100% - 2em) }
.k { display: inline-block; height: 10px; vertical-align: top }
.fit { display: inline-block; vertical-align: top }
</style>
<script type="text/x-rustyprint-expect">
#t { width: calc(100% - 32px); layout-width: 745.7008px }
#p { layout-width: 100px }
#pc { layout-width: 50px }
#q { layout-width: 100px }
#qc { layout-width: 60px }
#r { layout-width: 100px }
#rc { layout-width: 80px }
#s { layout-width: 104px }
</script>
</head>
<body>
<div id=t></div>
<div><div id=p class=fit><div id=pc style="width: 50%"><b class=k style="width: 100px"></b></div></div></div>
<div><div id=q class=fit><div id=qc style="width: calc(50% + 10px)"><b class=k style="width: 100px"></b></div></div></div>
<div><div id=r class=fit><div id=rc style="padding: 0 10%; margin: 0 10%"><b class=k style="width: 100px"></b></div></div></div>
<div><div id=s class=fit><table cellpadding=0 style="width: 30px"><tr><td><b class=k style="width: 100px"></b></td></tr></table></div></div>
</body>
</html>
