<!DOCTYPE html>
<html>
<head>
<title>inset-block</title>
<style>
body { margin: 0 }
.cb { position: relative; width: 200px; height: 100px; padding: 10px; border: 5px solid }
.cb > div { position: absolute; width: 20px; height: 20px }
</style>
<script type="text/x-rustyprint-expect">
#a { top: 10px; bottom: 10px; layout-y: 15px; layout-height: 100px }
</script>
</head>
<body>
<div class=cb><div id=a style="inset-block: 10px; height: auto"></div></div>
</body>
</html>
