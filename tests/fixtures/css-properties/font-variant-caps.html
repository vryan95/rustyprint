<!DOCTYPE html>
<html>
<head>
<title>font-variant-caps</title>
<style>
#t { font-variant-caps: all-small-caps }
</style>
<script type="text/x-rustyprint-expect">
#t { font-variant-caps: all-small-caps; layout-width: <#r }
</script>
</head>
<body>
<div><span id=t>TEXT</span></div>
<div><span id=r>TEXT</span></div>
</body>
</html>
