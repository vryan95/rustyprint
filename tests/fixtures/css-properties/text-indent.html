<!DOCTYPE html>
<html>
<head>
<title>text-indent</title>
<style>
#p { text-indent: 20px }
#h { text-indent: 1em hanging each-line }
</style>
<script type="text/x-rustyprint-expect">
#t { layout-x: 28px }
#p { text-indent: 20px }
#h { text-indent: 16px hanging each-line }
</script>
</head>
<body>
<div id=p><span id=t>x</span></div><div id=h></div>
</body>
</html>
