<!DOCTYPE html>
<html>
<head>
<title>mask-size</title>
<style>
body { margin: 0 }
div { width: 40px; height: 20px; background: blue; mask: url(assets/half.png) no-repeat }
</style>
<script type="text/x-rustyprint-expect">
#a { mask-size: 20px 20px; layout-mask: "8 10 255, 12 10 0" }
#b { mask-size: contain; layout-mask: "8 10 255, 12 10 0" }
#c { mask-size: auto; layout-mask: "4 5 255, 8 5 0" }
</script>
</head>
<body>
<div id=a style="mask-size: 20px 20px"></div>
<div id=b style="mask-size: contain"></div>
<div id=c></div>
</body>
</html>
