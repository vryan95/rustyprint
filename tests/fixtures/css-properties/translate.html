<!DOCTYPE html>
<html>
<head>
<title>translate</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { translate: 10px 20%; layout-paint: "transform(1,0,0,1,10,10)" }
#b { translate: 1px 2px 3px }
#c { translate: none; layout-paint: "!transform" }
</script>
</head>
<body>
<div id=a style="translate: 10px 20%"></div>
<div id=b style="translate: 1px 2px 3px"></div>
<div id=c></div>
</body>
</html>
