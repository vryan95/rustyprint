<!DOCTYPE html>
<html>
<head>
<title>text-emphasis</title>
<style>
#t { text-emphasis: open triangle red }
</style>
<script type="text/x-rustyprint-expect">
#t { text-emphasis-style: open triangle; text-emphasis-color: rgb(255, 0, 0); paint-items: >#r }
</script>
</head>
<body>
<div id=t>Text gjpq</div>
<div id=r>Text gjpq</div>
</body>
</html>
