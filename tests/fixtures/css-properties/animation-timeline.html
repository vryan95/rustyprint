<!DOCTYPE html>
<html>
<head>
<title>animation-timeline</title>
<style>
@keyframes slide { from { margin-left: 100px } to { margin-left: 0px } }
@keyframes grow { from, to { width: 5px } }
div { height: 1px; width: 10px }
#a { animation-timeline: auto, none, --scroller, scroll(root x), view(inline 10px 20%) }
#b { margin-left: 3px; animation: slide 4s linear -1s; animation-timeline: scroll() }
#c { margin-left: 3px; animation: slide 4s linear -1s; animation-timeline: none }
#d { animation: slide 4s linear -1s; animation-timeline: auto }
#bad { animation-timeline: scroll(foo) }
</style>
<script type="text/x-rustyprint-expect">
#a { animation-timeline: auto, none, --scroller, scroll(root x), view(inline 10px 20%) }
#b { margin-left: 3px }
#c { margin-left: 3px }
#d { margin-left: 75px }
html { animation-timeline: auto }
warning: invalid value for `animation-timeline`
</script>
</head>
<body>
<div id=a></div><div id=b></div><div id=c></div><div id=d></div><div id=bad></div>
</body>
</html>
