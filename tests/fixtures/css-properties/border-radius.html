<!DOCTYPE html>
<html>
<head>
<title>border-radius</title>
<style>
#t { border-radius: 1px 2px 3px / 4px }
#u { border-radius: 50% }
#v { border-radius: 1px 2px }
#r, #u { width: 100px; height: 50px; background: navy; border: 2px solid red }
</style>
<script type="text/x-rustyprint-expect">
#t { border-top-left-radius: 1px 4px; border-top-right-radius: 2px 4px; border-bottom-right-radius: 3px 4px; border-bottom-left-radius: 2px 4px }
#u { border-top-left-radius: 50%; border-bottom-right-radius: 50%; paint-items: <#r }
#v { border-top-left-radius: 1px; border-top-right-radius: 2px; border-bottom-right-radius: 1px; border-bottom-left-radius: 2px }
</script>
</head>
<body>
<div id=t></div><div id=u></div><div id=v></div><div id=r></div>
</body>
</html>
