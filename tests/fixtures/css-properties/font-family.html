<!DOCTYPE html>
<html>
<head>
<title>font-family</title>
<style>
#a, #b { font-family: "Noto Sans Mono", monospace }
</style>
<script type="text/x-rustyprint-expect">
#a { font-family: "Noto Sans Mono", monospace; layout-width: =#b }
</script>
</head>
<body>
<div><span id=a>iiii</span></div><div><span id=b>WWWW</span></div>
</body>
</html>
