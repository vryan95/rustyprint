<script type="text/x-rustyprint-expect">

</head>
<body>
<div id=t></div>

<table id=e style="height: 100px"><thead><tr id=e1><th><div style="height: 10px"></div></th></tr></thead><tbody></tbody></table>
<table id=f style="height: 90px"><tr id=f1 style="height: 20px"><td><b class=k></b></td></tr><tr id=f2><td><b class=k></b></td></tr></table>

<div style="height: 200px"><div id=l class=t style="height: 50%"><b class=k></b></div></div>
<div><div id=m class=t style="height: 50%"><b class=k></b></div></div>
<div id=n class=t style="height: 100px; max-height: 50px"><b class=k></b></div>
<div style="display: flex; height: 70px"><table id=o><tr id=o1><td><b class=k></b></td></tr></table></div>
<div style="position: relative; height: 70px"><div id=p class=t style="position: absolute; top: 0; bottom: 0"><b class=k></b></div></div>
<table id=q style="height: 10px"><tr><td><div style="height: 30px"></div></td></tr></table>

</html>
