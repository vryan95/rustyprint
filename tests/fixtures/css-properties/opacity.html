<!DOCTYPE html>
<html>
<head>
<title>opacity</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
</style>
<script type="text/x-rustyprint-expect">
#a { opacity: 0.5; layout-paint: "group(0.5) rect(#0000ff) /group" }
#b { opacity: 1; layout-paint: "!group rect(#0000ff)" }
#c { opacity: 0; layout-paint: "group(0) rect(#0000ff) /group" }
</script>
</head>
<body>
<div id=a style="opacity: 0.5"></div>
<div id=b style="opacity: 150%"></div>
<div id=c style="opacity: -1"></div>
</body>
</html>
