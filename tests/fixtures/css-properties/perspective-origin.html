<!DOCTYPE html>
<html>
<head>
<title>perspective-origin</title>
<style>
body { margin: 0 }
div { width: 100px; height: 50px; background: blue }
div { perspective: 100px }
div > div { transform: translateZ(-100px) }
</style>
<script type="text/x-rustyprint-expect">
#p { perspective-origin: 0px 0px; layout-paint: "transform(0.5,0,0,0.5,0,0)" }
#q { perspective-origin: 100% 50%; layout-paint: "transform(0.5,0,0,0.5,50,12.5)" }
</script>
</head>
<body>
<div id=p style="perspective-origin: 0 0"><div></div></div>
<div id=q style="perspective-origin: right"><div></div></div>
</body>
</html>
