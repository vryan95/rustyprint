<!DOCTYPE html>
<html>
<head>
<title>range</title>
<style>
@counter-style small { system: extends lower-alpha; range: 1 3; suffix: " " }
@counter-style two { system: extends upper-roman; range: infinite 2, 5 6; suffix: " " }
@counter-style back { system: cyclic; symbols: x; range: 2 3; fallback: upper-alpha }
@counter-style bad { system: extends decimal; range: 3 1 }
#s li { list-style-type: small }
#t li { list-style-type: two }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-text: "c a" }
#b { layout-text: "4 b" }
#c { layout-text: "II c" }
#d { layout-text: "3 d" }
#e { layout-text: "V e" }
#f { layout-text: "D. f" }
warning: invalid value for `range`
</script>
</head>
<body>
<ol id=s start=3><li id=a>a</li><li id=b>b</li></ol>
<ol id=t start=2><li id=c>c</li><li id=d>d</li></ol>
<ol id=t2 start=5><li id=e style="list-style-type: two">e</li></ol>
<ol start=4><li id=f style="list-style-type: back">f</li></ol>
</body>
</html>
