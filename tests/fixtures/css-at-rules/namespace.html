<!DOCTYPE html>
<html>
<head>
<title>@namespace</title>
<style>
@namespace svg url(http://www.w3.org/2000/svg);
svg|* { background-color: green }
</style>
<script type="text/x-rustyprint-expect">
#yes { background-color: rgb(0, 128, 0) }
#no { background-color: rgba(0, 0, 0, 0) }
</script>
</head>
<body>
<svg id=yes></svg><div id=no></div>
</body>
</html>
