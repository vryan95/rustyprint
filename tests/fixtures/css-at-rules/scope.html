<!DOCTYPE html>
<html>
<head>
<title>@scope</title>
<style>
@scope (.card) to (.content) { p { background-color: green } }
</style>
<script type="text/x-rustyprint-expect">
#yes { background-color: rgb(0, 128, 0) }
#no { background-color: rgba(0, 0, 0, 0) }
</script>
</head>
<body>
<div class=card><p id=yes></p><div class=content><p id=no></p></div></div>
</body>
</html>
