<!DOCTYPE html>
<html>
<head>
<title>font-feature-values</title>
<style>
@font-face { font-family: Simple; src: url(assets/simple.ttf) }
@font-face { font-family: Narrow; src: url(assets/narrow.ttf) }
@font-face { font-family: Var; src: url(assets/var.ttf) }
@font-face { font-family: Color; src: url(assets/color.ttf) }
@font-face { font-family: Feat; src: url(assets/features.ttf) }
.v { font-family: Var; font-optical-sizing: none }
@font-feature-values Feat, "Other Family" { @stylistic { nice: 2; } font-display: swap; color: red }
@font-feature-values Other { @stylistic { nice: 1; } }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-width: 6.5px }
#b { layout-width: 5px }
warning: unknown descriptor `color` in @font-feature-values
</script>
</head>
<body>
<p><span id=a style="font-family: Feat; font-variant-alternates: stylistic(nice)">a</span></p>
<p><span id=b style="font-family: Feat; font-variant-alternates: stylistic(unknown)">a</span></p>
</body>
</html>
