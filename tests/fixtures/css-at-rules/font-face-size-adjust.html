<!DOCTYPE html>
<html>
<head>
<title>font-face-size-adjust</title>
<style>
@font-face { font-family: Big; src: url(assets/simple.ttf); size-adjust: 200% }
@font-face { font-family: Small; src: url(assets/simple.ttf); size-adjust: 50% }
@font-face { font-family: Bad; src: url(assets/simple.ttf); size-adjust: 2 }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-width: 28px }
#b { layout-width: 7px }
#c { layout-height: 20px }
warning: invalid value for `size-adjust`
</script>
</head>
<body>
<p><span id=a style="font-family: Big">AA</span></p>
<p><span id=b style="font-family: Small">AA</span></p>
<div id=c style="font-family: Big; line-height: normal">A</div>
</body>
</html>
