<!DOCTYPE html>
<html>
<head>
<title>additive-symbols</title>
<style>
@counter-style tally { system: additive; additive-symbols: 5 "卌", 1 "|"; suffix: " " }
@counter-style zero { system: additive; additive-symbols: 2 b, 0 z; suffix: " " }
@counter-style gap { system: additive; additive-symbols: 3 c; suffix: " " }
@counter-style order { system: additive; additive-symbols: 1 a, 5 b }
@counter-style pictures { system: additive; additive-symbols: 5 url(assets/red.png), 1 "i"; suffix: " " }
#t li { list-style-type: tally }
#z li { list-style-type: zero }
#g li { list-style-type: gap }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-text: "卌||| a" }
#b { layout-text: "z b" }
#c { layout-text: "bb c" }
#d { layout-text: "2 d" }
#e { layout-text: "cc e" }
#f { layout-text: "ii f"; layout-image-alphas: "255 255" }
warning: invalid value for `additive-symbols`
warning: ignored @counter-style order
</script>
</head>
<body>
<ol id=t start=8><li id=a>a</li></ol>
<ol id=z start=0><li id=b>b</li></ol>
<ol id=z2 start=4><li id=c style="list-style-type: zero">c</li></ol>
<ol id=g start=2><li id=d>d</li></ol>
<ol start=6><li id=e style="list-style-type: gap">e</li></ol>
<ol start=12><li id=f style="list-style-type: pictures">f</li></ol>
</body>
</html>
