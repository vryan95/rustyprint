<!DOCTYPE html>
<html>
<head>
<title>@keyframes</title>
<style>
@keyframes grow { from { width: 100px } to { width: 200px } }
@keyframes steps { 0% { width: 0px } 50% { width: 100px; animation-timing-function: steps(2) } 100% { width: 300px } }
@keyframes partial { 50% { width: 300px } }
@keyframes paint { from { background-color: rgb(255, 0, 0) } to { background-color: rgb(0, 0, 255) } }
@keyframes move { to { transform: translate(100px, 50px) rotate(90deg) } }
@keyframes "quoted name" { from, to { margin-left: 7px } }
@keyframes ignored { from { animation-duration: 9s; width: 10px !important } }
@keyframes grow { from { height: 10px } }
div { width: 50px; height: 20px }
#a { animation: grow 4s linear -1s }
#b { animation: grow 4s linear 1s }
#c { animation: grow 4s linear 1s backwards }
#d { animation: grow 1s linear -2s forwards }
#e { animation: grow 1s linear -2s }
#f { animation: steps 2s linear -1.6s }
#g { animation: partial 4s linear -1s }
#h { animation: paint 2s linear -1s }
#i { animation: move 2s linear -1s }
#j { animation: "quoted name" 1s }
#k { animation: ignored 1s }
#l { animation: grow 4s linear -1s; height: 30px !important }
#m { animation: grow 2s ease-in -1s }
</style>
<script type="text/x-rustyprint-expect">
#a { width: 50px; height: 12.5px }
#b { width: 50px; height: 20px }
#c { height: 10px }
#d { height: 20px }
#e { height: 20px }
#f { width: 200px }
#g { width: 175px }
#h { background-color: rgb(140, 83, 162) }
#i { transform: translate(50px, 25px) rotate(45deg) }
#j { margin-left: 7px }
#k { width: 50px; animation-duration: 1s }
#l { height: 30px }
#m { height: 13.1536px }
</script>
</head>
<body>
<div id=a></div><div id=b></div><div id=c></div><div id=d></div><div id=e></div><div id=f></div>
<div id=g></div><div id=h></div><div id=i></div><div id=j></div><div id=k></div><div id=l></div>
<div id=m></div>
</body>
</html>
