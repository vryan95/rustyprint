<!DOCTYPE html>
<html>
<head>
<title>@supports</title>
<style>
@supports (display: flow-root) and selector(a > b) { #yes { background-color: green } }
@supports (made-up: 1) { #no { background-color: green } }
</style>
<script type="text/x-rustyprint-expect">
#yes { background-color: rgb(0, 128, 0) }
#no { background-color: rgba(0, 0, 0, 0) }
</script>
</head>
<body>
<div id=yes></div>
<div id=no></div>
</body>
</html>
