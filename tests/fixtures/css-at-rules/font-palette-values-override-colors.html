<!DOCTYPE html>
<html>
<head>
<title>font-palette-values-override-colors</title>
<style>
@font-face { font-family: Simple; src: url(assets/simple.ttf) }
@font-face { font-family: Narrow; src: url(assets/narrow.ttf) }
@font-face { font-family: Var; src: url(assets/var.ttf) }
@font-face { font-family: Color; src: url(assets/color.ttf) }
@font-face { font-family: Feat; src: url(assets/features.ttf) }
.v { font-family: Var; font-optical-sizing: none }
p { font-family: Color }
@font-palette-values --o { font-family: Color; override-colors: 0 orange, 1 #00000080 }
@font-palette-values --bad { font-family: Color; override-colors: 0 currentcolor }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-paint: "rect(#ffa500) pop clip-path rect(#00000080)" }
#b { layout-paint: "rect(#ff0000)" }
warning: invalid value for `override-colors`
</script>
</head>
<body>
<p id=a style="font-palette: --o">A</p>
<p id=b style="font-palette: --bad">A</p>
</body>
</html>
