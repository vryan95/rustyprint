<!DOCTYPE html>
<html>
<head>
<title>font-palette-values-font-family</title>
<style>
@font-face { font-family: Simple; src: url(assets/simple.ttf) }
@font-face { font-family: Narrow; src: url(assets/narrow.ttf) }
@font-face { font-family: Var; src: url(assets/var.ttf) }
@font-face { font-family: Color; src: url(assets/color.ttf) }
@font-face { font-family: Feat; src: url(assets/features.ttf) }
.v { font-family: Var; font-optical-sizing: none }
p { font-family: Color }
@font-palette-values --p { font-family: Other; base-palette: 1 }
@font-palette-values --p { font-family: Simple, Color; base-palette: 2 }
@font-palette-values --q { font-family: Other; base-palette: 1 }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-paint: "rect(#000000) pop clip-path rect(#ffffff)" }
#b { layout-paint: "rect(#ff0000) pop clip-path rect(#0000ff)" }
</script>
</head>
<body>
<p id=a style="font-palette: --p">A</p>
<p id=b style="font-palette: --q">A</p>
</body>
</html>
