<!DOCTYPE html>
<html>
<head>
<title>font-face-font-style</title>
<style>
@font-face { font-family: I; src: url(assets/simple.ttf); font-style: normal }
@font-face { font-family: I; src: url(assets/narrow.ttf); font-style: italic }
@font-face { font-family: O; src: url(assets/simple.ttf); font-style: oblique 0deg 20deg }
@font-face { font-family: Bad; src: url(assets/simple.ttf); font-style: oblique 100deg }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-width: 7px }
#b { layout-width: 3px }
#c { layout-width: 3px }
#d { layout-width: 7px }
warning: invalid value for `font-style`
</script>
</head>
<body>
<p><span id=a style="font-family: I">A</span></p>
<p><span id=b style="font-family: I; font-style: italic">A</span></p>
<p><span id=c style="font-family: I; font-style: oblique 10deg">A</span></p>
<p><span id=d style="font-family: O; font-style: oblique 10deg">A</span></p>
</body>
</html>
