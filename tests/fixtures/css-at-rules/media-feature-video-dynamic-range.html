<!DOCTYPE html>
<html>
<head>
<title>video-dynamic-range</title>
<style>
@media (video-dynamic-range: standard) { #yes { background-color: green } }
@media (video-dynamic-range: high) { #no { background-color: green } }
</style>
<script type="text/x-rustyprint-expect">
#yes { background-color: rgb(0, 128, 0) }
#no { background-color: rgba(0, 0, 0, 0) }
</script>
</head>
<body>
<div id=yes></div>
<div id=no></div>
</body>
</html>
