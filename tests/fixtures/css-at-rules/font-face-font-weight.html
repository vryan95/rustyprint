<!DOCTYPE html>
<html>
<head>
<title>font-face-font-weight</title>
<style>
@font-face { font-family: W; src: url(assets/simple.ttf); font-weight: 400 }
@font-face { font-family: W; src: url(assets/narrow.ttf); font-weight: bold }
@font-face { font-family: Light; src: url(assets/var.ttf); font-weight: 100 300 }
@font-face { font-family: Bad; src: url(assets/simple.ttf); font-weight: 1001 }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-width: 7px }
#b { layout-width: 3px }
#c { layout-width: 7px }
#d { layout-width: 3px }
#e { layout-width: 7px }
#f { layout-width: 7px }
warning: invalid value for `font-weight`
</script>
</head>
<body>
<p><span id=a style="font-family: W">A</span></p>
<p><span id=b style="font-family: W; font-weight: 700">A</span></p>
<p><span id=c style="font-family: W; font-weight: 300">A</span></p>
<p><span id=d style="font-family: W; font-weight: 600">A</span></p>
<p><span id=e style="font-family: W; font-weight: 450">A</span></p>
<p><span id=f style="font-family: Light; font-weight: 900; font-optical-sizing: none">A</span></p>
</body>
</html>
