<!DOCTYPE html>
<html>
<head>
<title>font-palette-values-base-palette</title>
<style>
@font-face { font-family: Simple; src: url(assets/simple.ttf) }
@font-face { font-family: Narrow; src: url(assets/narrow.ttf) }
@font-face { font-family: Var; src: url(assets/var.ttf) }
@font-face { font-family: Color; src: url(assets/color.ttf) }
@font-face { font-family: Feat; src: url(assets/features.ttf) }
.v { font-family: Var; font-optical-sizing: none }
p { font-family: Color }
@font-palette-values --second { font-family: Color; base-palette: 1 }
@font-palette-values --light { font-family: Color; base-palette: light }
@font-palette-values --dark { font-family: Color; base-palette: dark }
@font-palette-values --bad { font-family: Color; base-palette: -1 }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-paint: "rect(#00ff00) pop clip-path rect(#ffff00)" }
#b { layout-paint: "rect(#00ff00) pop clip-path rect(#ffff00)" }
#c { layout-paint: "rect(#000000) pop clip-path rect(#ffffff)" }
warning: invalid value for `base-palette`
</script>
</head>
<body>
<p id=a style="font-palette: --second">A</p>
<p id=b style="font-palette: --light">A</p>
<p id=c style="font-palette: --dark">A</p>
</body>
</html>
