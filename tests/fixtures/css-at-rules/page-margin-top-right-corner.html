<!DOCTYPE html>
<html>
<head>
<title>@top-right-corner</title>
<style>
@page { size: 400px 300px; margin: 50px }
body { margin: 0 }
@page { @top-right-corner { content: "t" } }
</style>
<script type="text/x-rustyprint-expect">
html { layout-page-margin-rects: "top-right-corner:350,0,50,50"; layout-page-margin-text: "top-right-corner:t" }
</script>
</head>
<body>
<p>x</p>
</body>
</html>
