<!DOCTYPE html>
<html>
<head>
<title>font-face-font-feature-settings</title>
<style>
@font-face { font-family: F; src: url(assets/features.ttf); font-feature-settings: "ss01" }
@font-face { font-family: Bad; src: url(assets/features.ttf); font-feature-settings: ss01 }
body { margin: 0; font-size: 10px; line-height: 1 }
p { margin: 0 }
</style>
<script type="text/x-rustyprint-expect">
#a { layout-width: 7px }
#b { layout-width: 5px }
warning: invalid value for `font-feature-settings`
</script>
</head>
<body>
<p><span id=a style="font-family: F">a</span></p>
<p><span id=b style="font-family: F; font-feature-settings: 'ss01' 0">a</span></p>
</body>
</html>
