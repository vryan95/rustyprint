<!DOCTYPE html>
<html>
<head>
<title>display-mode</title>
<style>
@media (display-mode: browser) { #yes { background-color: green } }
@media (display-mode: fullscreen) { #no { background-color: green } }
</style>
<script type="text/x-rustyprint-expect">
#yes { background-color: rgb(0, 128, 0) }
#no { background-color: rgba(0, 0, 0, 0) }
</script>
</head>
<body>
<div id=yes></div>
<div id=no></div>
</body>
</html>
