[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
# Not on crates.io until that is decided (plan.md, open questions).
publish = false

[workspace.dependencies]
rustyprint = { path = "crates/rustyprint" }
rustyprint-css = { path = "crates/rustyprint-css" }
rustyprint-dom = { path = "crates/rustyprint-dom" }
rustyprint-layout = { path = "crates/rustyprint-layout" }
rustyprint-pdf = { path = "crates/rustyprint-pdf" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
cbindgen = { version = "0.29.4", default-features = false }
cc = "1.8.0"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
cssparser = "0.38.0"
harfrust = "0.14.0"
html5ever = "0.40.1"
http-body-util = "0.1.5"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libtest-mimic = "0.8.2"
lopdf = "0.45.0"
miniz_oxide = "0.9.1"
# The version `image` uses, so that the two share one copy; 0.9 waits for `image` to move.
moxcms = "0.8.1"
pdf-writer = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
skrifa = "0.48.0"
subsetter = "0.2.6"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
wuff = "0.2.9"
ureq = "3.4.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
