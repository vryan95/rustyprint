# cargo-deny: licences, security advisories, banned crates and crate sources.
# CI runs `cargo deny check`; see https://embarkstudios.github.io/cargo-deny/.

[graph]
all-features = true

[advisories]
# Every advisory fails the check, including crates that are unmaintained or yanked.
unmaintained = "all"
yanked = "deny"
# Unmaintained crates kept on purpose, each with the reason.
ignore = [
    # hyphenation reads its dictionaries, compiled into the binary, with bincode; no document
    # data reaches it. The maintained alternative, hypher, has 48 of hyphenation's 78
    # dictionaries, so switching would drop languages such as Romanian, Latvian and Thai.
    { id = "RUSTSEC-2025-0141", reason = "bincode: hyphenation deserializes its embedded dictionaries with it" },
]

[licenses]
# Permissive licences only.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# The workspace crates are not published and have no licence yet (plan.md, open questions).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies within the workspace are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
