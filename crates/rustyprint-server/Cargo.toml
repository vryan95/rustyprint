[package]
name = "rustyprint-server"
description = "HTTP service that renders HTML and CSS to PDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Makes rendering panic on a `<!--rustyprint:panic-->` comment, to test internal errors.
test-support = ["rustyprint/test-support"]

[dependencies]
rustyprint = { workspace = true, features = ["serde"] }
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The tests use the optional features.
rustyprint-server = { path = ".", features = ["test-support"] }
http-body-util.workspace = true
lopdf.workspace = true
tower.workspace = true

[lints]
workspace = true
